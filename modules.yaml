# Describe your modules here, then run:
#
#   ./yii module:build
#   ./yii migrate:up
#
# Field types: string, text, integer, bigint, float, decimal, boolean, json, date, datetime,
#              timestamp, time, uuid, enum. Add `?` for nullable, `:args` for size/scale/values.
# Relations:   belongsTo, hasOne, hasMany, belongsToMany, morphMany, morphOne.
#              A morph relation takes the morph name last: `morphMany:Comment:commentable`.

modules:
  Product:
    fields:
      name: string:120
      slug: { type: string, size: 150, unique: true }
      price: decimal:10,2
      is_active: boolean
      status: enum:draft,published,archived
      metadata: json?
      description: text?
      published_at: datetime?
    relations:
      category: belongsTo:Category
      tags: belongsToMany:Tag
      comments: morphMany:Comment:commentable

  Category:
    fields:
      name: string:120
      slug: { type: string, size: 150, unique: true }
    relations:
      products: hasMany:Product
      comments: morphMany:Comment:commentable

  Tag:
    fields:
      name: string:60
      color: string:7
    relations:
      products: belongsToMany:Product

  # The target of the polymorphic relations above. The generator adds `commentable_type` and
  # `commentable_id` to it, indexes them together, and writes a CommentableResolver to walk the
  # relation back — Active Record cannot express that direction as a relation.
  Comment:
    fields:
      author: string:120
      body: text
